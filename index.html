<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YoYo Part Practice</title>
<style>
:root{--bg0:#080b12;--bg1:#0d1320;--panel:rgba(22,29,43,.78);--line:rgba(148,170,210,.18);--text:#f5f8ff;--muted:#aab5c9;--a1:#3978ff;--a2:#6b5cff;font-family:"Avenir Next","Helvetica Neue","Hiragino Sans","Yu Gothic UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 12% 4%,rgba(61,112,255,.17),transparent 28%),radial-gradient(circle at 92% 20%,rgba(116,76,255,.13),transparent 26%),linear-gradient(155deg,var(--bg1),var(--bg0) 58%,#070910);background-attachment:fixed}
.app{max-width:760px;margin:auto;padding:18px 16px 40px}.title{font-size:25px;font-weight:800;margin:8px 0 4px;letter-spacing:-.04em}.card{background:linear-gradient(145deg,rgba(28,36,52,.88),rgba(16,21,32,.80));border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 16px 42px rgba(0,0,0,.24)}
button,.file{border:1px solid rgba(255,255,255,.09);border-radius:13px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:700;padding:12px 15px;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(25,70,190,.22)}.file{display:inline-block}input[type=file]{display:none}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.small,.segtimes{font-size:12px;color:var(--muted)}.time{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700}.bar{width:100%;accent-color:#668cff}.topActions{display:flex;gap:8px;flex-wrap:nowrap}.topActions>*{white-space:nowrap}.splitActions{display:flex;gap:10px;margin-top:12px}.splitActions button{width:50%}.segment{display:flex;align-items:center;gap:9px;padding:10px;border-radius:13px;background:linear-gradient(145deg,rgba(38,47,65,.8),rgba(26,33,47,.74));margin-top:8px}.segment.selected{outline:2px solid #5d83ff}.selectbox{width:22px;height:22px;accent-color:#5d83ff}.partName,.saveName,#loopDelay{background:rgba(7,11,18,.62);color:#fff;border:1px solid rgba(155,177,218,.32);border-radius:8px;padding:6px 8px;font-size:16px;font-weight:600}.partName{width:145px;max-width:40vw}.segment button{padding:8px 10px;font-size:13px}.empty{text-align:center;color:#7e8798;padding:14px}.danger,.deleteSaved{background:linear-gradient(135deg,#743f49,#5e343d)!important}.loopDelayLabel{display:flex;align-items:center;gap:5px}#loopDelay{width:58px;text-align:center;font-size:14px}.savedModal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px}.savedModalBox{width:min(560px,100%);max-height:75vh;overflow:auto;background:#171a22;border:1px solid #3a4150;border-radius:18px;padding:18px}.savedModalHead{display:flex;align-items:center;justify-content:space-between;font-size:21px;margin-bottom:12px}.closeSaved{width:44px;height:44px;padding:0;font-size:28px}.saveName{width:100%;padding:10px}.savedPractices{display:grid;gap:8px}.savedItem{display:flex;gap:8px}.openSaved{flex:1;text-align:left}@media(max-width:480px){.time{font-size:24px}}
</style></head><body><main class="app">
<div class="title">YoYo Part Practice</div>
<section class="card"><div class="row" style="margin-bottom:12px"><b>曲選択パート</b></div>
<div class="topActions"><button id="newFileBtn" type="button">新規作成</button><input id="file" type="file" accept="audio/mpeg,audio/mp3,video/mp4,audio/mp4,.mp3,.mp4" style="display:none"><button id="savePracticeOpen">保存</button><button id="openSaved">保存データを開く</button></div><div id="loadstatus" class="small" style="margin-top:8px"></div></section>
<section class="card"><div class="row" style="margin-bottom:10px"><b>分割パート</b></div><div class="row"><div id="current" class="time">0:00.00</div><div class="grow"></div><div id="duration" class="small">0:00.00</div></div><input id="seek" class="bar" type="range" min="0" max="1000" value="0"><div class="splitActions"><button id="play">再生</button><button id="cut">分割</button></div></section>
<section class="card"><div class="row"><b>練習パート</b><div class="grow"></div><label class="small"><input id="loop" type="checkbox" checked> 選択範囲をループ</label><label class="small loopDelayLabel">無音 <input id="loopDelay" type="number" min="0" max="60" step="1" value="0"> 秒</label></div><div class="small" style="margin-top:8px">複数パートを選択すると、最初の選択パートから最後の選択パートまで通しで再生します。</div><button id="playSelected" style="width:100%;margin-top:10px">選択パートを通し再生</button><div id="segments"><div class="empty">曲を読み込むとパート1が表示されます</div></div><button id="reset" class="danger" style="width:100%;margin-top:12px">区切りをすべて削除</button></section>
<div id="saveNameModal" class="savedModal" style="display:none"><div class="savedModalBox"><div class="savedModalHead"><b>保存名称</b><button id="closeSaveName" class="closeSaved">×</button></div><input id="saveName" class="saveName" placeholder="保存名（例：練習曲1）"><button id="savePractice" style="margin-top:12px">保存</button></div></div>
<div id="savedPanel" class="savedModal" style="display:none"><div class="savedModalBox"><div class="savedModalHead"><b>保存データ</b><button id="closeSaved" class="closeSaved">×</button></div><div id="savedPracticesTop" class="savedPractices"></div></div></div>
<video id="audio" playsinline preload="metadata" style="display:none"></video>
</main><script>
const $=id=>document.getElementById(id),audio=$('audio'),seek=$('seek');
let cuts=[],partNames=[],selected=new Set(),playRange=null,currentSourceFile=null,objectUrl=null,loopTimer=null,loopWaiting=false;
const fmt=t=>{if(!isFinite(t))return'0:00.00';let m=Math.floor(t/60),s=t-m*60;return `${m}:${s.toFixed(2).padStart(5,'0')}`};

function loadFile(f){
 if(!f)return;
 audio.pause(); clearTimeout(loopTimer); loopWaiting=false;
 playRange=null;
 // 新しい曲を開く前に、前の曲の再生状態とカーソルを完全に初期化
 try{audio.currentTime=0}catch(e){}
 seek.value=0;
 $('current').textContent='0:00.00';
 $('duration').textContent='0:00.00';
 $('play').textContent='再生';
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 currentSourceFile=f; objectUrl=URL.createObjectURL(f);
 audio.removeAttribute('src'); audio.src=objectUrl; audio.load();
 cuts=[];partNames=[];selected.clear();playRange=null;
 $('loadstatus').textContent='読み込み中…'; renderSegments();
}
$('file').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)loadFile(f)});
// Important: clear the picker BEFORE every new selection, so a second song and even the same file can be opened after saving.
$('newFileBtn').addEventListener('click',()=>{const f=$('file');f.value='';f.click();});

audio.onloadedmetadata=()=>{audio.currentTime=0;seek.value=0;$('current').textContent='0:00.00';$('play').textContent='再生';$('duration').textContent=fmt(audio.duration);$('loadstatus').textContent='読み込み完了';renderSegments()};
audio.onerror=()=>{$('loadstatus').textContent='このファイルを再生できません。MP3またはiPhoneで再生可能なMP4を選択してください。'};
audio.ontimeupdate=()=>{
 $('current').textContent=fmt(audio.currentTime); seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;
 if(playRange&&audio.currentTime>=playRange.end-.03&&!loopWaiting){
  if($('loop').checked){const start=playRange.start;audio.pause();audio.currentTime=playRange.end;loopWaiting=true;clearTimeout(loopTimer);const delay=Math.max(0,Math.min(60,+$('loopDelay').value||0))*1000;loopTimer=setTimeout(()=>{loopWaiting=false;if(playRange&&$('loop').checked){audio.currentTime=start;audio.play()}},delay)}
  else{audio.pause();audio.currentTime=playRange.end;playRange=null}
 }
};
seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration};
$('play').onclick=()=>{if(!audio.src)return alert('先に曲を読み込んでください');audio.paused?audio.play():audio.pause()};
audio.onplay=()=>$('play').textContent='一時停止'; audio.onpause=()=>$('play').textContent='再生';
$('cut').onclick=()=>{if(!audio.src||!isFinite(audio.duration))return alert('先に曲を読み込んでください');let t=audio.currentTime;if(t<.15||t>audio.duration-.15)return alert('曲の開始・終了付近では区切れません');if(cuts.some(x=>Math.abs(x-t)<.15))return;cuts.push(t);cuts.sort((a,b)=>a-b);selected.clear();playRange=null;renderSegments()};
function getSegments(){if(!isFinite(audio.duration))return[];let pts=[0,...cuts,audio.duration];return pts.slice(0,-1).map((s,i)=>({start:s,end:pts[i+1],name:partNames[i]||`パート${i+1}`}))}
function renderSegments(){
 const box=$('segments'),segs=getSegments();box.innerHTML='';
 if(!segs.length){box.innerHTML='<div class="empty">曲を読み込むとパート1が表示されます</div>';return}
 segs.forEach((x,i)=>{const d=document.createElement('div');d.className='segment'+(selected.has(i)?' selected':'');
 d.innerHTML=`<input class="selectbox" type="checkbox" ${selected.has(i)?'checked':''}><div class="grow"><input class="partName" value="${x.name.replaceAll('"','&quot;')}"><div class="segtimes">${fmt(x.start)} → ${fmt(x.end)}</div></div><button class="go">再生</button>${i<segs.length-1?'<button class="del">削除</button>':''}`;
 const name=d.querySelector('.partName');name.onchange=()=>{partNames[i]=name.value.trim()||`パート${i+1}`};
 const cb=d.querySelector('.selectbox');cb.onchange=()=>{cb.checked?selected.add(i):selected.delete(i);if(selected.size>=2){let a=[...selected].sort((a,b)=>a-b);for(let n=a[0];n<=a.at(-1);n++)selected.add(n)}playRange=null;renderSegments()};
 d.querySelector('.go').onclick=()=>{clearTimeout(loopTimer);loopWaiting=false;playRange={start:x.start,end:x.end};audio.currentTime=x.start;audio.play()};
 const del=d.querySelector('.del');if(del)del.onclick=()=>{cuts.splice(i,1);partNames.splice(i+1,1);selected.clear();playRange=null;renderSegments()};
 box.appendChild(d);
 })}
$('playSelected').onclick=()=>{let segs=getSegments();if(!segs.length)return alert('先に曲を読み込んでください');if(!selected.size)return alert('再生したいパートを選択してください');let ids=[...selected].sort((a,b)=>a-b);playRange={start:segs[ids[0]].start,end:segs[ids.at(-1)].end};audio.currentTime=playRange.start;audio.play()};
$('reset').onclick=()=>{if(cuts.length&&confirm('本当に区切りをすべて削除しますか？')){cuts=[];partNames=[];selected.clear();playRange=null;renderSegments()}};

const META='yoyoPracticeSavedV2',DB='YoYoPracticeFilesV2',STORE='files';
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function put(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function del(k){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete(k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
const meta=()=>{try{return JSON.parse(localStorage.getItem(META)||'[]')}catch{return[]}},write=a=>localStorage.setItem(META,JSON.stringify(a));
function renderSaved(){let b=$('savedPracticesTop'),a=meta();b.innerHTML=a.length?'':'<div class="small">保存データはありません</div>';a.forEach(p=>{let r=document.createElement('div');r.className='savedItem';let o=document.createElement('button');o.className='openSaved';o.textContent=p.name;o.onclick=async()=>{let s=await get(p.fileKey);if(!s)return alert('保存した曲データが見つかりません');let f=s instanceof File?s:new File([s],p.fileName||'practice-media',{type:p.fileType||s.type||''});if(objectUrl)URL.revokeObjectURL(objectUrl);currentSourceFile=f;objectUrl=URL.createObjectURL(f);audio.src=objectUrl;cuts=[...(p.cuts||[])];partNames=[...(p.partNames||[])];selected.clear();playRange=null;audio.load();$('savedPanel').style.display='none'};let x=document.createElement('button');x.className='deleteSaved';x.textContent='削除';x.onclick=async()=>{if(confirm('この保存データを削除しますか？')){await del(p.fileKey);write(meta().filter(v=>v.id!==p.id));renderSaved()}};r.append(o,x);b.append(r)})}
$('savePracticeOpen').onclick=()=>{$('saveName').value='';$('saveNameModal').style.display='flex'};
$('closeSaveName').onclick=()=>$('saveNameModal').style.display='none';
$('savePractice').onclick=async()=>{let name=$('saveName').value.trim();if(!name)return alert('保存名を入力してください');if(!currentSourceFile)return alert('先にMP3 / MP4を読み込んでください');let id=Date.now().toString(),key='file_'+id;await put(key,currentSourceFile);let a=meta();a.unshift({id,name,fileKey:key,fileName:currentSourceFile.name,fileType:currentSourceFile.type,cuts:[...cuts],partNames:[...partNames]});write(a);$('saveNameModal').style.display='none';renderSaved();
 // Ensure next New File action is never blocked by the previous file selection.
 $('file').value='';
};
$('openSaved').onclick=()=>{$('savedPanel').style.display='flex';renderSaved()};
$('closeSaved').onclick=()=>$('savedPanel').style.display='none';
$('saveNameModal').onclick=e=>{if(e.target===$('saveNameModal'))$('saveNameModal').style.display='none'};
$('savedPanel').onclick=e=>{if(e.target===$('savedPanel'))$('savedPanel').style.display='none'};

// Remove old PWA caches/service workers so stale index.html is not shown after replacement.
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
})();

renderSegments();renderSaved();
</script></body></html>
