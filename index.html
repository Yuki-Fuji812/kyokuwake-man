<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YoYo Part Practice</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YoYo Practice"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#fff}.app{max-width:760px;margin:auto;padding:18px 16px 40px}.title{font-size:25px;font-weight:800;margin:8px 0 4px}.sub{color:#9ba3b2;font-size:13px;margin-bottom:18px}.card{background:#171a22;border:1px solid #292e3b;border-radius:18px;padding:15px;margin:12px 0}button,.file{border:0;border-radius:13px;background:#2c65f6;color:white;font-weight:700;padding:12px 15px;font-size:15px;cursor:pointer}.file{display:inline-block}input[type=file]{display:none}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.time{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800}.bar{width:100%;accent-color:#5d83ff}.small{font-size:12px;color:#9ba3b2}.controls{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.controls button{padding:12px 5px;background:#252a36}.controls .play,.cut{background:#2c65f6}.cut{width:100%;margin-top:12px;font-size:17px;padding:15px}.segment{display:flex;align-items:center;gap:9px;padding:10px;border-radius:13px;background:#20242e;margin-top:8px}.segment.selected{outline:2px solid #5d83ff;background:#252c3c}.selectbox{width:22px;height:22px;accent-color:#5d83ff}.segment button{padding:8px 10px;font-size:13px}.segname{font-weight:700}.segtimes{font-size:12px;color:#aab1be}.empty{text-align:center;color:#7e8798;padding:14px}.speed{display:flex;gap:7px;flex-wrap:wrap}.speed button{background:#252a36;padding:8px 11px}.speed button.on{background:#2c65f6}.danger{background:#59343a!important}@media(max-width:480px){.time{font-size:24px}}
</style></head><body><main class="app"><div class="title">🪀 YoYo Part Practice</div><div class="sub">止めた位置で区切るだけ。パートは自動で増えていきます。</div>
<section class="card"><div class="row"><label class="file">MP3 / MP4を読み込む<input id="file" type="file" accept="audio/mpeg,audio/mp3,video/mp4,audio/mp4,.mp3,.mp4"></label><div id="filename" class="small grow">MP3またはMP4ファイルを選択してください</div><div id="loadstatus" class="small" style="width:100%;margin-top:8px"></div></div></section>
<section class="card"><div class="row"><div id="current" class="time">0:00.00</div><div class="grow"></div><div id="duration" class="small">0:00.00</div></div><input id="seek" class="bar" type="range" min="0" max="1000" value="0"><div class="controls"><button id="play" class="play">▶ 再生</button></div><button id="cut" class="cut">✂️ ここで区切る</button><div class="small" style="margin-top:8px;text-align:center">再生を止め、カーソルを合わせて「ここで区切る」</div></section>
<section class="card"><div class="small" style="margin-bottom:8px"></div><div id="speeds" class="speed"></div></section>
<section class="card"><div class="row"><b>練習パート</b><div class="grow"></div><label class="small"><input id="loop" type="checkbox" checked> 選択範囲をループ</label></div><div class="small" style="margin-top:8px">複数パートを選択すると、最初の選択パートから最後の選択パートまで通しで再生します。</div><button id="playSelected" style="width:100%;margin-top:10px">▶ 選択パートを通し再生</button><div id="segments"><div class="empty">曲を読み込むとパート1が表示されます</div></div><button id="reset" class="danger" style="width:100%;margin-top:12px">区切りをすべて削除</button></section>
<video id="audio" playsinline preload="metadata" style="display:none"></video></main><script>
const $=id=>document.getElementById(id),audio=$('audio'),seek=$('seek');let cuts=[],activeIndex=null,selected=new Set(),playRange=null;const fmt=t=>{if(!isFinite(t))return'0:00.00';let m=Math.floor(t/60),s=t-m*60;return `${m}:${s.toFixed(2).padStart(5,'0')}`};
let objectUrl=null;
$('file').onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f)return;let ext=(f.name.split('.').pop()||'').toLowerCase();if(!['mp3','mp4'].includes(ext))return alert('MP3またはMP4ファイルを選択してください');audio.pause();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);audio.removeAttribute('src');audio.src=objectUrl;audio.load();$('filename').textContent=f.name;$('loadstatus').textContent='読み込み中…';cuts=[];activeIndex=null;selected.clear();playRange=null;renderSegments()};
audio.onloadedmetadata=()=>{$('duration').textContent=fmt(audio.duration);$('loadstatus').textContent='✓ 読み込み完了（Bluetoothイヤホン接続時はiPhoneの音声出力先に従います）';renderSegments()};
audio.onerror=()=>{$('loadstatus').textContent='このファイルを再生できません。MP3、またはH.264/AACなどiPhoneで再生可能なMP4を選択してください。';alert('ファイルを読み込めませんでした。MP3またはiPhoneで再生可能なMP4を選択してください。')};
audio.ontimeupdate=()=>{$('current').textContent=fmt(audio.currentTime);seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;if(playRange&&audio.currentTime>=playRange.end-.03){if($('loop').checked){audio.currentTime=playRange.start}else{audio.pause();audio.currentTime=playRange.end;playRange=null}}};
seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration};
$('play').onclick=()=>{if(!audio.src)return alert('先に曲を読み込んでください');audio.paused?audio.play():audio.pause()};audio.onplay=()=>$('play').textContent='⏸ 一時停止';audio.onpause=()=>$('play').textContent='▶ 再生';
$('cut').onclick=()=>{if(!audio.src||!isFinite(audio.duration))return alert('先に曲を読み込んでください');let t=audio.currentTime;if(t<.15||t>audio.duration-.15)return alert('曲の開始・終了付近では区切れません');if(cuts.some(x=>Math.abs(x-t)<.15))return alert('ほぼ同じ位置に区切りがあります');cuts.push(t);cuts.sort((a,b)=>a-b);activeIndex=null;selected.clear();playRange=null;renderSegments()};
function getSegments(){if(!isFinite(audio.duration))return[];let pts=[0,...cuts,audio.duration];return pts.slice(0,-1).map((s,i)=>({start:s,end:pts[i+1],name:'パート'+(i+1)}))}
function renderSegments(){let box=$('segments'),segs=getSegments();box.innerHTML='';if(!segs.length){box.innerHTML='<div class="empty">曲を読み込むとパート1が表示されます</div>';return}segs.forEach((x,i)=>{let d=document.createElement('div');d.className='segment'+(selected.has(i)?' selected':'');d.innerHTML=`<input class="selectbox" type="checkbox" ${selected.has(i)?'checked':''}><div class="grow"><div class="segname">${x.name}</div><div class="segtimes">${fmt(x.start)} → ${fmt(x.end)}</div></div><button class="go">▶ 練習</button>${i<segs.length-1?'<button class="del">区切り削除</button>':''}`;let cb=d.querySelector('.selectbox');cb.onchange=()=>{cb.checked?selected.add(i):selected.delete(i);renderSegments()};d.querySelector('.go').onclick=()=>{activeIndex=i;playRange={start:x.start,end:x.end};audio.currentTime=x.start;audio.play()};let del=d.querySelector('.del');if(del)del.onclick=()=>{cuts.splice(i,1);activeIndex=null;selected.clear();playRange=null;renderSegments()};box.appendChild(d)})}
$('playSelected').onclick=()=>{let segs=getSegments();if(!segs.length)return alert('先に曲を読み込んでください');if(!selected.size)return alert('再生したいパートを選択してください');let ids=[...selected].sort((a,b)=>a-b),first=ids[0],last=ids[ids.length-1];playRange={start:segs[first].start,end:segs[last].end};activeIndex=null;audio.currentTime=playRange.start;audio.play()};$('reset').onclick=()=>{if(!cuts.length)return;cuts=[];activeIndex=null;selected.clear();playRange=null;renderSegments()};
[.5,.75,1,1.25,1.5].forEach(v=>{let b=document.createElement('button');b.textContent=v+'×';if(v===1)b.classList.add('on');b.onclick=()=>{audio.playbackRate=v;document.querySelectorAll('#speeds button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('speeds').appendChild(b)});
renderSegments();

const PROJECT_KEY='yoyoProjectsV1'; let pendingProject=null;
function projects(){try{return JSON.parse(localStorage.getItem(PROJECT_KEY)||'[]')}catch(e){return[]}}
function saveProjects(x){localStorage.setItem(PROJECT_KEY,JSON.stringify(x));drawProjects()}
function drawProjects(){
 const box=$('savedProjects'), ps=projects(); box.innerHTML='';
 if(!ps.length){box.innerHTML='<div class="small">まだパート練習データはありません</div>';return}
 ps.forEach((p,i)=>{
   const d=document.createElement('div'); d.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #2a2f3a';
   const t=document.createElement('div'); t.innerHTML='<b>'+escapeHtml(p.name)+'</b><div class="small">'+(p.cuts.length+1)+'パート</div>';
   const r=document.createElement('div'); r.className='row';
   const o=document.createElement('button'); o.className='secondary'; o.style.width='auto'; o.textContent='開く';
   o.onclick=()=>{pendingProject=p; alert('同じ曲ファイルを選んでください。区切り位置を復元します。'); fileInput.click()};
   const x=document.createElement('button'); x.className='danger'; x.style.width='auto'; x.textContent='削除';
   x.onclick=()=>{const a=projects();a.splice(i,1);saveProjects(a)};
   r.append(o,x); d.append(t,r); box.appendChild(d);
 })
}
$('saveProject').onclick=()=>{
 const f=fileInput.files&&fileInput.files[0]; if(!f)return alert('先に曲を読み込んでください');
 const a=projects(), defaultName='パート練習'+(a.length+1);
 const name=prompt('保存名',defaultName); if(!name)return;
 const p={name:name,fileName:f.name,cuts:[...cuts],savedAt:Date.now()};
 const i=a.findIndex(x=>x.name===name); if(i>=0)a[i]=p;else a.push(p);
 saveProjects(a); alert('「'+name+'」として保存しました');
};
fileInput.addEventListener('change',()=>{
 if(!pendingProject)return;
 const f=fileInput.files&&fileInput.files[0]; if(!f||f.name!==pendingProject.name)return;
 const restore=()=>{cuts=[...pendingProject.cuts].filter(x=>x>0&&x<media.duration).sort((a,b)=>a-b);renderSegments();pendingProject=null};
 if(Number.isFinite(media.duration)&&media.duration>0)restore();else media.addEventListener('loadedmetadata',restore,{once:true});
});
function currentPartIndex(){
 const b=bounds(); if(!b.length)return 0; const t=media.currentTime;
 const i=b.findIndex(x=>t>=x.start&&t<x.end); return i<0?Math.max(0,b.length-1):i;
}
function playPartStart(i){
 const b=bounds(); if(!b.length)return; i=Math.max(0,Math.min(i,b.length-1));
 media.currentTime=b[i].start; media.play().catch(()=>{});
}
function headphonePrevious(){
 const b=bounds(); if(!b.length)return; const i=currentPartIndex(), elapsed=media.currentTime-b[i].start;
 playPartStart(elapsed<=2?i-1:i);
}
function headphoneNext(){playPartStart(currentPartIndex()+1)}

function remoteLog(label, result){
 const el=$('remoteEventLog'); if(!el)return;
 const now=new Date().toLocaleTimeString();
 el.textContent=now+'  受信: '+label+(result?' → '+result:'');
}
if($('clearRemoteLog')) $('clearRemoteLog').onclick=()=>{$('remoteEventLog').textContent='待機中…'};

function loggedPrevious(label){
 const b=bounds(); if(!b.length){remoteLog(label,'曲を読み込んでください');return}
 const i=currentPartIndex(), elapsed=media.currentTime-b[i].start;
 const target=elapsed<=2?Math.max(0,i-1):i;
 remoteLog(label,'パート'+(target+1)+'の先頭');
 playPartStart(target);
}
function loggedNext(label){
 const b=bounds(); if(!b.length){remoteLog(label,'曲を読み込んでください');return}
 const target=Math.min(b.length-1,currentPartIndex()+1);
 remoteLog(label,'パート'+(target+1)+'の先頭');
 playPartStart(target);
}
if('mediaSession' in navigator){
 try{
  navigator.mediaSession.setActionHandler('play',()=>{remoteLog('Play','再生');media.play()});
  navigator.mediaSession.setActionHandler('pause',()=>{remoteLog('Pause','一時停止');media.pause()});
  navigator.mediaSession.setActionHandler('previoustrack',()=>loggedPrevious('Previous Track'));
  navigator.mediaSession.setActionHandler('nexttrack',()=>loggedNext('Next Track'));
  navigator.mediaSession.setActionHandler('seekbackward',()=>loggedPrevious('Seek Backward'));
  navigator.mediaSession.setActionHandler('seekforward',()=>loggedNext('Seek Forward'));
 }catch(e){remoteLog('Media Session','このブラウザでは一部操作を登録できません')}
}else{
 remoteLog('Media Session','このブラウザは未対応');
}

drawProjects();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=8').catch(()=>{}));
}
</script></body></html>
