</section>
<video id="audio" playsinline preload="metadata" style="display:none"></video></main><script>
const $=id=>document.getElementById(id),audio=$('audio'),seek=$('seek');let cuts=[],activeIndex=null,selected=new Set(),playRange=null,partNames=[];const fmt=t=>{if(!isFinite(t))return'0:00.00';let m=Math.floor(t/60),s=t-m*60;return `${m}:${s.toFixed(2).padStart(5,'0')}`};
let objectUrl=null;
$('file').onchange=e=>{
  currentSourceFile=e.target.files&&e.target.files[0]?e.target.files[0]:null;
  const f=currentSourceFile;
  if(!f)return;
  setSongTitle(f.name);
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!['mp3','mp4'].includes(ext))return alert('');
  audio.pause();
  if(typeof loopDelayTimer!=='undefined')clearTimeout(loopDelayTimer);
  if(typeof loopWaiting!=='undefined')loopWaiting=false;
  cuts=[]; partNames=[]; selected.clear(); activeIndex=null; playRange=null;
  audio.currentTime=0;
  seek.value=0;
  $('current').textContent='0:00.00';
  $('duration').textContent='0:00.00';
  $('play').textContent='▶ 再生';
  renderSegments();
  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(f);
  audio.removeAttribute('src');
  audio.src=objectUrl;
  $('loadstatus').textContent='読み込み中…';
  audio.load();
};
audio.onloadedmetadata=()=>{audio.currentTime=0;seek.value=0;$('current').textContent='0:00.00';$('duration').textContent=fmt(audio.duration);$('loadstatus').textContent='✓ 読み込み完了（Bluetoothイヤホン接続時はiPhoneの音声出力先に従います）';renderSegments()};
audio.onerror=()=>{$('loadstatus').textContent='このファイルを再生できません。MP3、またはH.264/AACなどiPhoneで再生可能なMP4を選択してください。';alert('ファイルを読み込めませんでした。MP3またはiPhoneで再生可能なMP4を選択してください。')};
let loopDelayTimer=null,loopWaiting=false;
let countdownTimers=[];
function clearCountdown(){countdownTimers.forEach(clearTimeout);countdownTimers=[];if('speechSynthesis' in window)speechSynthesis.cancel()}
function scheduleCountdown(delayMs){
  clearCountdown();
  if(delayMs<5000||!('speechSynthesis' in window))return;
  const speak=n=>{const u=new SpeechSynthesisUtterance(String(n));u.lang='ja-JP';u.rate=1.05;u.volume=1;speechSynthesis.speak(u)};
  [3,2,1].forEach((n,i)=>countdownTimers.push(setTimeout(()=>speak(n),Math.max(0,delayMs-(3000-i*1000)))));
}
audio.ontimeupdate=()=>{
  $('current').textContent=fmt(audio.currentTime);
  seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;
  if(playRange&&audio.currentTime>=playRange.end-.03&&!loopWaiting){
    if($('loop').checked){
      const start=playRange.start;
      audio.pause();
      audio.currentTime=playRange.end;
      loopWaiting=true;
      clearTimeout(loopDelayTimer);
      const delay=Math.max(0,Math.min(60,parseFloat($('loopDelay').value)||0))*1000;
      scheduleCountdown(delay);
      loopDelayTimer=setTimeout(()=>{
        loopWaiting=false;
        if(playRange&&$('loop').checked){
          audio.currentTime=start;
          audio.play();
        }
      },delay);
    }else{
      audio.pause();
      audio.currentTime=playRange.end;
      playRange=null;
    }
  }
};
seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration};
$('play').onclick=()=>{if(!audio.src)return alert('先に曲を読み込んでください');audio.paused?audio.play():audio.pause()};audio.onplay=()=>$('play').textContent='⏸ 一時停止';audio.onpause=()=>$('play').textContent='▶ 再生';
$('cut').onclick=()=>{if(!audio.src||!isFinite(audio.duration))return alert('先に曲を読み込んでください');let t=audio.currentTime;if(t<.15||t>audio.duration-.15)return alert('曲の開始・終了付近では区切れません');if(cuts.some(x=>Math.abs(x-t)<.15))return alert('ほぼ同じ位置に区切りがあります');cuts.push(t);cuts.sort((a,b)=>a-b);activeIndex=null;selected.clear();playRange=null;renderSegments()};
function getSegments(){if(!isFinite(audio.duration))return[];let pts=[0,...cuts,audio.duration];return pts.slice(0,-1).map((s,i)=>({start:s,end:pts[i+1],name:partNames[i]||('パート'+(i+1))}))}
function renderSegments(){let box=$('segments'),segs=getSegments();box.innerHTML='';if(!segs.length){box.innerHTML='<div class="empty">曲を読み込むとパート1が表示されます</div>';return}segs.forEach((x,i)=>{let d=document.createElement('div');d.className='segment'+(selected.has(i)?' selected':'');d.innerHTML=`<input class="selectbox" type="checkbox" ${selected.has(i)?'checked':''}><div class="grow"><input class="partName" value="${x.name}" aria-label="パート${i+1}の名称"><div class="segtimes">${fmt(x.start)} → ${fmt(x.end)}</div></div><button class="go">▶ 再生</button>${i<segs.length-1?'<button class="del">削除</button>':''}`;let name=d.querySelector('.partName');name.onchange=()=>{partNames[i]=name.value.trim()||('パート'+(i+1));name.value=partNames[i]};let cb=d.querySelector('.selectbox');cb.onchange=()=>{
      if(cb.checked) selected.add(i); else selected.delete(i);
      if(selected.size>=2){
        const nums=[...selected].sort((a,b)=>a-b);
        const first=nums[0], last=nums[nums.length-1];
        for(let n=first;n<=last;n++) selected.add(n);
      }
      playRange=null;
      renderSegments();
    };d.querySelector('.go').onclick=()=>{clearTimeout(loopDelayTimer);clearCountdown();loopWaiting=false;activeIndex=i;playRange={start:x.start,end:x.end};audio.currentTime=x.start;audio.play()};let del=d.querySelector('.del');if(del){
      let holdTimer=null, didDelete=false;
      const cancelHold=()=>{clearTimeout(holdTimer);holdTimer=null;del.classList.remove('holding')};
      const startHold=e=>{e.preventDefault();didDelete=false;cancelHold();del.classList.add('holding');holdTimer=setTimeout(()=>{didDelete=true;del.classList.remove('holding');cuts.splice(i,1);partNames.splice(i+1,1);activeIndex=null;selected.clear();playRange=null;renderSegments()},1000)};
      del.addEventListener('pointerdown',startHold);
      del.addEventListener('pointerup',cancelHold);
      del.addEventListener('pointercancel',cancelHold);
      del.addEventListener('pointerleave',cancelHold);
      del.onclick=e=>{e.preventDefault();e.stopPropagation()};
    }box.appendChild(d)})}
function setSongTitle(name){
  const el=$('songTitle'); if(!el)return;
  el.classList.remove('scrolling');
  el.textContent=name||'曲を選択してください';
  requestAnimationFrame(()=>{
    const wrap=el.parentElement;
    if(name && el.scrollWidth>wrap.clientWidth){el.classList.add('scrolling')}
  });
}

$('playSelected').onclick=()=>{clearTimeout(loopDelayTimer);clearCountdown();loopWaiting=false;let segs=getSegments();if(!segs.length)return alert('先に曲を読み込んでください');if(!selected.size)return alert('再生したいパートを選択してください');let ids=[...selected].sort((a,b)=>a-b),first=ids[0],last=ids[ids.length-1];playRange={start:segs[first].start,end:segs[last].end};activeIndex=null;audio.currentTime=playRange.start;audio.play()};$('reset').onclick=()=>{if(!cuts.length)return;if(!confirm('本当に区切りをすべて削除しますか？'))return;cuts=[];partNames=[];activeIndex=null;selected.clear();playRange=null;renderSegments()};
renderSegments();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=9').catch(()=>{}));
}

// Saved practice data: audio/video blob + cuts + names, for one-tap recall.
const PRACTICE_META_KEY='yoyoPracticeSavedV2';
const PRACTICE_DB='YoYoPracticeFilesV2';
const PRACTICE_STORE='files';

let currentSourceFile=null;
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(f) currentSourceFile=f;
});


function openPracticeDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(PRACTICE_DB,1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(PRACTICE_STORE)) req.result.createObjectStore(PRACTICE_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function putPracticeFile(key,file){
  const db=await openPracticeDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PRACTICE_STORE,'readwrite');
    tx.objectStore(PRACTICE_STORE).put(file,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function getPracticeFile(key){
  const db=await openPracticeDB();
  return new Promise((resolve,reject)=>{
    const req=db.transaction(PRACTICE_STORE).objectStore(PRACTICE_STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function deletePracticeFile(key){
  const db=await openPracticeDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PRACTICE_STORE,'readwrite');
    tx.objectStore(PRACTICE_STORE).delete(key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
function savedMeta(){try{return JSON.parse(localStorage.getItem(PRACTICE_META_KEY)||'[]')}catch(e){return []}}
function writeMeta(a){localStorage.setItem(PRACTICE_META_KEY,JSON.stringify(a))}
function renderSavedPractices(){
  const box=document.getElementById('savedPracticesTop'); if(!box)return;
  const a=savedMeta();
  box.innerHTML=a.length?'':'<div class="small">保存データはありません</div>';
  a.forEach(p=>{
    const row=document.createElement('div'); row.className='savedItem';
    const op=document.createElement('button'); op.className='primary openSaved'; op.textContent='▶ '+p.name;
    op.onclick=async()=>{
      const stored=await getPracticeFile(p.fileKey);
      if(!stored){alert('保存した曲データが見つかりません。曲を読み直して再保存してください。');return}
      const f=stored instanceof File ? stored : new File([stored],p.fileName||'practice-media',{type:p.fileType||stored.type||''});
      if(objectUrl)URL.revokeObjectURL(objectUrl);
      objectUrl=URL.createObjectURL(f); currentSourceFile=f;
      audio.src=objectUrl;
      audio.load();
      cuts=[...(p.cuts||[])]; partNames=[...(p.partNames||[])];
      activeIndex=null; selected.clear(); playRange=null;
      audio.onloadedmetadata=()=>{renderSegments();audio.currentTime=0;updateUI&&updateUI()};
      document.getElementById('savedPanel').style.display='none';
    };
    const del=document.createElement('button'); del.className='deleteSaved'; del.textContent='削除';
    del.onclick=async()=>{
      if(!confirm('この保存データを削除しますか？'))return;
      await deletePracticeFile(p.fileKey);
      writeMeta(savedMeta().filter(x=>x.id!==p.id)); renderSavedPractices();
    };
    row.append(op,del); box.appendChild(row);
  });
}
function openSaveNameModal(){
 const input=document.getElementById('saveName');
 const modal=document.getElementById('saveNameModal');
 if(input)input.value='';
 if(modal)modal.style.display='flex';
 setTimeout(()=>{if(input)input.focus()},50);
}
document.getElementById('closeSaveName').onclick=()=>{document.getElementById('saveNameModal').style.display='none'};
document.getElementById('saveNameModal').onclick=e=>{if(e.target.id==='saveNameModal')e.currentTarget.style.display='none'};
document.getElementById('savePractice').onclick=async()=>{
  const name=document.getElementById('saveName').value.trim();
  if(!name){alert('保存名を入力してください');return}
  if(!currentSourceFile){alert('先にMP3 / MP4を読み込んでください');return}
  const id=Date.now().toString(), fileKey='file_'+id;
  await putPracticeFile(fileKey,currentSourceFile);
  const verifyFile=await getPracticeFile(fileKey);
  if(!verifyFile){alert('曲ファイルの保存に失敗しました');return}
  const a=savedMeta(); a.unshift({id,name,fileKey,fileName:currentSourceFile.name||'practice-media',fileType:currentSourceFile.type||'',cuts:[...cuts],partNames:[...partNames]});
  writeMeta(a); document.getElementById('saveName').value=''; document.getElementById('saveNameModal').style.display='none'; renderSavedPractices();
};
document.getElementById('openSaved').onclick=()=>{
  const p=document.getElementById('savedPanel');
  p.style.display='flex';
  renderSavedPractices();
};
document.getElementById('closeSaved').onclick=()=>{document.getElementById('savedPanel').style.display='none'};
document.getElementById('savedPanel').onclick=e=>{if(e.target.id==='savedPanel')e.currentTarget.style.display='none'};
renderSavedPractices();

// Prevent iOS long-press text/callout behavior on part delete buttons.
document.addEventListener('contextmenu', e=>{
  if(e.target && e.target.closest && e.target.closest('.segment .del')) e.preventDefault();
});

</script>
