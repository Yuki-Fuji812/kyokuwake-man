<video id="audio" playsinline preload="metadata" style="display:none"></video></main><script>
const $=id=>document.getElementById(id),audio=$('audio'),seek=$('seek');let cuts=[],activeIndex=null,selected=new Set(),playRange=null,partNames=[];const fmt=t=>{if(!isFinite(t))return'0:00.00';let m=Math.floor(t/60),s=t-m*60;return `${m}:${s.toFixed(2).padStart(5,'0')}`};
let objectUrl=null;
$('file').onchange=e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!['mp3','mp4'].includes(ext))return alert('');
  currentSourceFile=f;

  setSelectedPlaybackLock(false);
  audio.pause();
  clearTimeout(loopDelayTimer);
  clearCountdown();
  loopWaiting=false;
  cuts=[];
  partNames=[];
  selected.clear();
  activeIndex=null;
  playRange=null;
  try{audio.currentTime=0}catch(_){}
  seek.value=0;
  $('current').textContent='0:00.00';
  $('duration').textContent='0:00.00';
  renderSegments();

  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(f);
  audio.removeAttribute('src');
  audio.src=objectUrl;
  audio.load();

  const fn=$('filename');
  fn.textContent=f.name;
  fn.classList.remove('marquee');
  requestAnimationFrame(()=>fn.classList.toggle('marquee',fn.scrollWidth>fn.parentElement.clientWidth));
  $('loadstatus').textContent='読み込み中…';
};
audio.onloadedmetadata=()=>{$('duration').textContent=fmt(audio.duration);$('loadstatus').textContent='✓ 読み込み完了（Bluetoothイヤホン接続時はiPhoneの音声出力先に従います）';renderSegments()};
audio.onerror=()=>{$('loadstatus').textContent='このファイルを再生できません。MP3、またはH.264/AACなどiPhoneで再生可能なMP4を選択してください。';alert('ファイルを読み込めませんでした。MP3またはiPhoneで再生可能なMP4を選択してください。')};

let countdownCtx=null,countdownBuffer=null,countdownSource=null,countdownDecodePromise=null;

function beepArrayBuffer(){
  const b64=countdownBeepSrc.split(',')[1],bin=atob(b64),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return u8.buffer;
}
function unlockCountdownBeep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!countdownCtx)countdownCtx=new AC();
    if(countdownCtx.state==='suspended')countdownCtx.resume();
    if(!countdownBuffer&&!countdownDecodePromise){
      countdownDecodePromise=countdownCtx.decodeAudioData(beepArrayBuffer().slice(0))
        .then(b=>countdownBuffer=b).catch(()=>null);
    }
  }catch(e){}
}
function stopCountdownSound(){
  if(countdownSource){try{countdownSource.stop()}catch(e){} countdownSource=null;}
}
function clearCountdown(){
  countdownTimers.forEach(clearTimeout);countdownTimers=[];stopCountdownSound();
}
function playCountdownBeep(){
  if(!countdownCtx||!countdownBuffer)return;
  stopCountdownSound();
  try{
    const src=countdownCtx.createBufferSource();
    src.buffer=countdownBuffer;src.connect(countdownCtx.destination);
    countdownSource=src;src.onended=()=>{if(countdownSource===src)countdownSource=null};
    src.start();
  }catch(e){}
}
function startIntervalCountdown(delaySec){
  clearCountdown();
  if(delaySec<5)return;
  countdownTimers.push(setTimeout(playCountdownBeep,(delaySec-3)*1000));
}
audio.ontimeupdate=()=>{
  $('current').textContent=fmt(audio.currentTime);
  seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;
  if(playRange&&audio.currentTime>=playRange.end-.03&&!loopWaiting){
    if($('loop').checked){
      const start=playRange.start;
      audio.pause();
      audio.currentTime=playRange.end;
      loopWaiting=true;
      clearTimeout(loopDelayTimer);
      const delaySec=Math.max(0,Math.min(60,parseInt($('loopDelay').value,10)||0));
      const delay=delaySec*1000;
      startIntervalCountdown(delaySec);
      loopDelayTimer=setTimeout(()=>{
        clearCountdown();
        loopWaiting=false;
        if(playRange&&$('loop').checked){
          audio.currentTime=start;
          audio.play();
        }
      },delay);
    }else{
      audio.pause();
      audio.currentTime=playRange.end;
      playRange=null;
      setSelectedPlaybackLock(false);
    }
  }
};

function getSegments(){if(!isFinite(audio.duration))return[];let pts=[0,...cuts,audio.duration];return pts.slice(0,-1).map((s,i)=>({start:s,end:pts[i+1],name:partNames[i]||('パート'+(i+1))}))}
function setSelectedPlaybackLock(locked){
 selectedPlaybackLocked=!!locked;
 if($('cut'))$('cut').disabled=selectedPlaybackLocked;

 if($('modeSplit'))$('modeSplit').disabled=selectedPlaybackLocked;
 document.querySelectorAll('#segments .selectbox,#segments .del').forEach(el=>el.disabled=selectedPlaybackLocked);
 const delayWrap=$('loopDelay') ? $('loopDelay').closest('.interval') || $('loopDelay').parentElement : null;

}
function renderSegments(){let box=$('segments'),segs=getSegments();box.innerHTML='';if(!segs.length){box.innerHTML='<div class="empty">曲を読み込むとパート1が表示されます</div>';return}segs.forEach((x,i)=>{let d=document.createElement('div');d.className='segment'+(selected.has(i)?' selected':'');d.innerHTML=`<input class="selectbox" type="checkbox" ${selected.has(i)?'checked':''}><div class="grow"><input class="partName" value="${x.name}" aria-label="パート${i+1}の名称"><div class="segtimes">${fmt(x.start)} → ${fmt(x.end)}</div></div>${i<segs.length-1?'<button class="del">削除</button>':''}`;let name=d.querySelector('.partName');name.onchange=()=>{partNames[i]=name.value.trim()||('パート'+(i+1));name.value=partNames[i]};let cb=d.querySelector('.selectbox');cb.onchange=()=>{

        for(let n=first;n<=last;n++) selected.add(n);
      }
      playRange=null;
      renderSegments();
    };let del=d.querySelector('.del');if(del){
 let holdTimer=null;
 const cancel=()=>{if(holdTimer){clearTimeout(holdTimer);holdTimer=null}};

 del.addEventListener('pointerdown',begin);
 del.addEventListener('pointerup',cancel);
 del.addEventListener('pointercancel',cancel);
 del.addEventListener('pointerleave',cancel);
 del.addEventListener('contextmenu',ev=>ev.preventDefault());
 del.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation()});
}box.appendChild(d)});if(selectedPlaybackLocked)setSelectedPlaybackLock(true)}
function startCheckedPartsPlayback(){
 unlockCountdownBeep();clearTimeout(loopDelayTimer);clearCountdown();loopWaiting=false;
 const segs=getSegments();if(!segs.length)return false;
 let first=0,last=segs.length-1;

}

const PRACTICE_META_KEY='yoyoPracticeSavedV2';
const PRACTICE_DB='YoYoPracticeFilesV2';
const PRACTICE_STORE='files';

let currentSourceFile=null;
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(f) currentSourceFile=f;
});


function openPracticeDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(PRACTICE_DB,1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(PRACTICE_STORE)) req.result.createObjectStore(PRACTICE_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function putPracticeFile(key,file){
  const db=await openPracticeDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PRACTICE_STORE,'readwrite');
    tx.objectStore(PRACTICE_STORE).put(file,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function getPracticeFile(key){
  const db=await openPracticeDB();
  return new Promise((resolve,reject)=>{
    const req=db.transaction(PRACTICE_STORE).objectStore(PRACTICE_STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function deletePracticeFile(key){
  const db=await openPracticeDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PRACTICE_STORE,'readwrite');
    tx.objectStore(PRACTICE_STORE).delete(key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
function savedMeta(){try{return JSON.parse(localStorage.getItem(PRACTICE_META_KEY)||'[]')}catch(e){return []}}
function writeMeta(a){localStorage.setItem(PRACTICE_META_KEY,JSON.stringify(a))}
function renderSavedPractices(){
  const box=document.getElementById('savedPracticesTop'); if(!box)return;
  const a=savedMeta();
  box.innerHTML=a.length?'':'<div class="small">保存データはありません</div>';
  a.forEach(p=>{
    const row=document.createElement('div'); row.className='savedItem';
    const op=document.createElement('button'); op.className='primary openSaved'; op.textContent='▶ '+p.name;
    op.onclick=async()=>{
      const stored=await getPracticeFile(p.fileKey);
      if(!stored){alert('保存した曲データが見つかりません。曲を読み直して再保存してください。');return}
      const f=stored instanceof File ? stored : new File([stored],p.fileName||'practice-media',{type:p.fileType||stored.type||''});
      if(objectUrl)URL.revokeObjectURL(objectUrl);
      objectUrl=URL.createObjectURL(f); currentSourceFile=f;
      const fn=$('filename');
      fn.textContent=f.name||p.fileName||'曲を選択してください';
      fn.classList.remove('marquee');
      requestAnimationFrame(()=>fn.classList.toggle('marquee',fn.scrollWidth>fn.parentElement.clientWidth));
      audio.pause();
      clearTimeout(loopDelayTimer);clearCountdown();loopWaiting=false;setSelectedPlaybackLock(false);
      audio.src=objectUrl;
      cuts=[...(p.cuts||[])]; partNames=[...(p.partNames||[])];
      activeIndex=null; selected.clear(); playRange=null;
      const onSavedLoaded=()=>{
        audio.removeEventListener('loadedmetadata',onSavedLoaded);
        renderSegments();audio.pause();audio.currentTime=0;seek.value=0;
        $('current').textContent='0:00.00';$('play').textContent='▶ 再生';
        if(typeof updateUI==='function')updateUI();
      };
      audio.addEventListener('loadedmetadata',onSavedLoaded);
      audio.load();
      document.getElementById('savedPanel').style.display='none';
    };
    const del=document.createElement('button'); del.className='deleteSaved'; del.textContent='削除';
    del.onclick=async()=>{
      if(!confirm('この保存データを削除しますか？'))return;
      await deletePracticeFile(p.fileKey);
      writeMeta(savedMeta().filter(x=>x.id!==p.id)); renderSavedPractices();
    };
    row.append(op,del); box.appendChild(row);
  });
}
function openSaveNameModal(){
 const input=document.getElementById('saveName');
 const modal=document.getElementById('saveNameModal');
 if(input)input.value='';
 if(modal)modal.style.display='flex';
 setTimeout(()=>{if(input)input.focus()},50);
}
document.getElementById('closeSaveName').onclick=()=>{document.getElementById('saveNameModal').style.display='none'};
document.getElementById('saveNameModal').onclick=e=>{if(e.target.id==='saveNameModal')e.currentTarget.style.display='none'};
document.getElementById('savePractice').onclick=async()=>{
  const name=document.getElementById('saveName').value.trim();
  if(!name){alert('保存名を入力してください');return}
  if(!currentSourceFile){alert('先にMP3 / MP4を読み込んでください');return}
  const id=Date.now().toString(), fileKey='file_'+id;
  await putPracticeFile(fileKey,currentSourceFile);
  const verifyFile=await getPracticeFile(fileKey);
  if(!verifyFile){alert('曲ファイルの保存に失敗しました');return}
  const a=savedMeta(); a.unshift({id,name,fileKey,fileName:currentSourceFile.name||'practice-media',fileType:currentSourceFile.type||'',cuts:[...cuts],partNames:[...partNames]});
  writeMeta(a); document.getElementById('saveName').value=''; document.getElementById('saveNameModal').style.display='none'; renderSavedPractices();
};
document.getElementById('openSaved').onclick=()=>{
  const p=document.getElementById('savedPanel');
  p.style.display='flex';
  renderSavedPractices();
};
document.getElementById('closeSaved').onclick=()=>{document.getElementById('savedPanel').style.display='none'};
document.getElementById('savedPanel').onclick=e=>{if(e.target.id==='savedPanel')e.currentTarget.style.display='none'};
renderSavedPractices();
</script>
